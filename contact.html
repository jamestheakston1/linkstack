<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Contact Us | LinkStack Support</title>
    <meta name="description" content="Get in touch with the LinkStack team. We are here to help with your digital identity and bio link questions.">
    <meta name="author" content="James Theakston">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://link-stack.pages.dev/contact.html">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .input-field { width: 100%; padding: 1rem; background: #f8fafc; border: 2px solid #f1f5f9; border-radius: 1rem; outline: none; transition: all 0.2s; font-weight: 500; }
        .input-field:focus { border-color: #6366f1; background: #fff; ring: 4px; ring-color: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 glass py-4 px-8 flex justify-between items-center">
        <div class="flex items-center gap-2 font-black text-2xl text-indigo-600 cursor-pointer" onclick="location.href='/'">
            <i data-feather="layers"></i><span>LinkStack</span>
        </div>
        <button onclick="location.href='/?auth=true'" class="px-6 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-800 transition">Dashboard</button>
    </nav>

    <main class="flex-grow pt-32 pb-24 px-6 flex items-center justify-center">
        <div class="max-w-xl w-full">
            <div class="text-center mb-12">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <i data-feather="mail" class="w-8 h-8"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-4">Get in touch</h1>
                <p class="text-slate-500 font-medium">Have a question or need help with your account? Send us a message and we'll get back to you as soon as possible.</p>
            </div>

            <div class="bg-white rounded-[2.5rem] p-8 md:p-10 shadow-sm border border-slate-100">
                <form action="https://formspree.io/f/mqeagdvv" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Full Name</label>
                        <input type="text" name="name" required class="input-field" placeholder="John Doe">
                    </div>

                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Your Email</label>
                        <input type="email" name="email" required class="input-field" placeholder="name@example.com">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Your Message</label>
                        <textarea name="message" required rows="5" class="input-field resize-none" placeholder="How can we help you?"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-100 hover:scale-[1.02] active:scale-[0.98] transition flex items-center justify-center gap-2">
                        <i data-feather="send" class="w-4 h-4"></i>
                        Send Message
                    </button>
                </form>
            </div>

            <div class="mt-12 grid grid-cols-2 gap-6">
                <div class="text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Response Time</p>
                    <p class="text-sm font-bold text-slate-900">Under 24 Hours</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Support Hours</p>
                    <p class="text-sm font-bold text-slate-900">9am - 5pm GMT</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 px-8 border-t border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2 font-black text-xl text-indigo-600">
                <i data-feather="layers"></i><span>LinkStack</span>
            </div>
            <p class="text-slate-400 text-xs font-bold">© 2026 LinkStack by James Theakston</p>
            <div class="flex gap-6">
                <a href="/" class="text-slate-400 hover:text-indigo-600 text-xs font-bold transition">Home</a>
                <a href="/terms" class="text-slate-400 hover:text-indigo-600 text-xs font-bold transition">Terms</a>
                <a href="/privacy" class="text-slate-400 hover:text-indigo-600 text-xs font-bold transition">Privacy</a>
            </div>
        </div>
    </footer>

    <script>
        feather.replace();
    </script>
</body>
</html>
