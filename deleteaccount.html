<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account | LinkStack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal-blur { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: none; }
        .modal-blur.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 py-4 px-8 flex justify-between items-center">
        <div class="flex items-center gap-2 font-black text-2xl text-indigo-600 cursor-pointer" onclick="location.href='/dashboard'">
            <i data-feather="layers"></i><span>LinkStack</span>
        </div>
        <button onclick="switchAccount()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition">
            <i data-feather="users" class="w-4 h-4"></i> Switch Account
        </button>
    </nav>

    <main class="max-w-xl mx-auto pt-40 px-6 text-center">
        <div class="p-10 bg-white rounded-[2.5rem] border-2 border-slate-100 shadow-xl shadow-slate-200/50">
            <div class="w-24 h-24 rounded-3xl border-4 border-white shadow-xl overflow-hidden bg-slate-100 mx-auto mb-6">
                <img id="user-avatar" src="" class="w-full h-full object-cover hidden">
                <div id="avatar-placeholder" class="w-full h-full flex items-center justify-center text-slate-300">
                    <i data-feather="user" class="w-10 h-10"></i>
                </div>
            </div>

            <h1 class="text-3xl font-black tracking-tighter mb-2">Delete Account</h1>
            <p id="user-handle-display" class="text-indigo-600 font-bold mb-10">@loading...</p>

            <button onclick="openAuthModal()" class="w-full py-4 bg-red-600 text-white font-black rounded-2xl shadow-lg shadow-red-100 hover:bg-red-700 transition flex items-center justify-center gap-2">
                <i data-feather="trash-2" class="w-4 h-4"></i> Start Deletion Process
            </button>
        </div>
    </main>

    <div id="auth-modal" class="modal-blur fixed inset-0 z-[100] items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] max-w-md w-full p-8 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black tracking-tight">Confirm Identity</h2>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600"><i data-feather="x"></i></button>
            </div>
            
            <p class="text-slate-500 text-sm font-medium mb-6">Please sign in again to confirm you want to delete this account. This is for your security.</p>

            <div class="space-y-4">
                <button onclick="reAuthGithub()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl flex items-center justify-center gap-3 hover:bg-black transition">
                    <i data-feather="github" class="w-5 h-5"></i> GitHub Confirmation
                </button>

                <div class="flex items-center gap-4 py-2 before:h-px before:flex-1 before:bg-slate-100 after:h-px after:flex-1 after:bg-slate-100 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                    Or Email
                </div>

                <input type="email" id="re-email" placeholder="Email" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                <input type="password" id="re-password" placeholder="Password" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                
                <button id="final-delete-btn" onclick="handleReAuthDelete()" class="w-full py-4 bg-red-600 text-white font-black rounded-2xl shadow-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                    Verify & Delete Account
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.8';

        const SB_URL = 'https://xcicvuqdoztxhidwdmlc.supabase.co';
        const SB_KEY = 'YOUR_ANON_KEY';
        const supabase = createClient(SB_URL, SB_KEY);

        let currentUserId = '';

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return window.location.href = '/login.html';
            currentUserId = user.id;

            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('user-handle-display').innerText = `@${profile.handle}`;
                if (profile.avatar_url) {
                    const img = document.getElementById('user-avatar');
                    img.src = profile.avatar_url;
                    img.classList.remove('hidden');
                    document.getElementById('avatar-placeholder').classList.add('hidden');
                }
            }
        }

        window.openAuthModal = () => document.getElementById('auth-modal').classList.add('active');
        window.closeAuthModal = () => document.getElementById('auth-modal').classList.remove('active');

        window.reAuthGithub = async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/delete-account.html?confirm=true' }
            });
        };

        window.handleReAuthDelete = async () => {
            const email = document.getElementById('re-email').value;
            const password = document.getElementById('re-password').value;
            const btn = document.getElementById('final-delete-btn');

            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="w-4 h-4 animate-spin"></i> Verifying...';
            feather.replace();

            const { error: authError } = await supabase.auth.signInWithPassword({ email, password });

            if (authError) {
                alert('Verification failed: ' + authError.message);
                btn.disabled = false;
                btn.innerText = 'Verify & Delete Account';
                feather.replace();
                return;
            }

            const { error: deleteError } = await supabase.from('profiles').delete().eq('id', currentUserId);

            if (deleteError) {
                alert('Error removing profile data.');
            } else {
                window.location.href = '/deleted.html';
            }
        };

        window.switchAccount = async () => {
            await supabase.auth.signOut();
            window.location.href = '/login.html';
        };

        init();
        feather.replace();
    </script>
</body>
</html>
