<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account | LinkStack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); display: none; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 py-4 px-8 flex justify-between items-center">
        <div class="flex items-center gap-2 font-black text-2xl text-indigo-600 cursor-pointer" onclick="location.href='/dashboard'">
            <i data-feather="layers"></i><span>LinkStack</span>
        </div>
        <button onclick="switchAccount()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition">
            <i data-feather="users" class="w-4 h-4"></i> Switch Account
        </button>
    </nav>

    <main class="max-w-xl mx-auto pt-32 px-6 pb-24 text-center">
        <div class="p-10 bg-white rounded-[2.5rem] border-2 border-slate-100 shadow-xl shadow-slate-200/50">
            
            <div class="w-24 h-24 rounded-3xl border-4 border-white shadow-xl overflow-hidden bg-slate-100 mx-auto mb-6">
                <img id="user-avatar" src="" class="w-full h-full object-cover hidden">
                <div id="avatar-placeholder" class="w-full h-full flex items-center justify-center text-slate-300">
                    <i data-feather="user" class="w-10 h-10"></i>
                </div>
            </div>

            <h1 class="text-3xl font-black tracking-tighter mb-1">Delete Account</h1>
            <p id="user-handle-display" class="text-indigo-600 font-bold mb-10">@loading...</p>

            <div class="space-y-4">
                <button onclick="openAuthModal()" class="w-full py-4 bg-red-50 text-red-600 font-black rounded-2xl border-2 border-red-100 hover:bg-red-100 transition flex items-center justify-center gap-2">
                    <i data-feather="trash-2" class="w-4 h-4"></i> Delete Account
                </button>
                <button onclick="switchAccount()" class="w-full py-4 text-slate-400 font-bold hover:text-slate-600 transition flex items-center justify-center gap-2">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i> Switch Account
                </button>
            </div>
        </div>
    </main>

    <div id="auth-modal" class="modal-overlay fixed inset-0 z-[100] items-center justify-center p-6">
        <div class="bg-white rounded-[3rem] max-w-md w-full p-10 shadow-2xl border border-slate-100">
            <div id="reauth-step">
                <h2 class="text-2xl font-black tracking-tight mb-2">Verify Identity</h2>
                <p class="text-slate-500 text-sm font-medium mb-8">Please re-authenticate to prove you own this stack.</p>

                <div class="space-y-4">
                    <input type="email" id="re-email" placeholder="Confirm Email" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                    <input type="password" id="re-password" placeholder="Confirm Password" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                    
                    <button id="verify-btn" onclick="handleReAuth()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                        Verify Account
                    </button>
                    <button onclick="closeAuthModal()" class="w-full py-4 text-slate-400 font-bold">Cancel</button>
                </div>
            </div>

            <div id="consequence-step" class="hidden">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mb-6 mx-auto">
                    <i data-feather="alert-triangle"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight mb-4 text-red-600">Irreversible Action</h2>
                <ul class="text-left space-y-3 mb-8 text-sm font-medium text-slate-600">
                    <li class="flex items-start gap-2"><i data-feather="check" class="w-4 h-4 text-red-500 mt-1"></i> Handle will be deleted immediately.</li>
                    <li class="flex items-start gap-2"><i data-feather="check" class="w-4 h-4 text-red-500 mt-1"></i> All links and data will be wiped.</li>
                    <li class="flex items-start gap-2"><i data-feather="check" class="w-4 h-4 text-red-500 mt-1"></i> This cannot be undone.</li>
                </ul>

                <button id="final-delete-btn" onclick="executePermanentDelete()" disabled class="w-full py-4 bg-red-600 text-white font-black rounded-2xl shadow-lg opacity-50 cursor-not-allowed transition">
                    Delete Everything (5s)
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.8';

        const SB_URL = 'https://xcicvuqdoztxhidwdmlc.supabase.co';
        const SB_KEY = 'YOUR_ANON_KEY';
        const supabase = createClient(SB_URL, SB_KEY);

        let currentUserId = '';

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            currentUserId = user.id;

            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('user-handle-display').innerText = `@${profile.handle}`;
                if (profile.avatar_url) {
                    const img = document.getElementById('user-avatar');
                    img.src = profile.avatar_url;
                    img.classList.remove('hidden');
                    document.getElementById('avatar-placeholder').classList.add('hidden');
                }
            }
            feather.replace();
        }

        window.openAuthModal = () => document.getElementById('auth-modal').classList.add('active');
        window.closeAuthModal = () => document.getElementById('auth-modal').classList.remove('active');

        window.handleReAuth = async () => {
            const email = document.getElementById('re-email').value;
            const password = document.getElementById('re-password').value;
            const btn = document.getElementById('verify-btn');

            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="w-4 h-4 animate-spin"></i>';
            feather.replace();

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Verification failed: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Verify Account';
                feather.replace();
            } else {
                startCountdown();
            }
        };

        function startCountdown() {
            document.getElementById('reauth-step').classList.add('hidden');
            document.getElementById('consequence-step').classList.remove('hidden');
            feather.replace();

            const btn = document.getElementById('final-delete-btn');
            let time = 5;
            
            const timer = setInterval(() => {
                time--;
                btn.innerText = `Delete Everything (${time}s)`;
                if (time <= 0) {
                    clearInterval(timer);
                    btn.innerText = "Delete Everything";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        window.executePermanentDelete = async () => {
            const btn = document.getElementById('final-delete-btn');
            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="w-4 h-4 animate-spin"></i>';
            feather.replace();

            const { error } = await supabase.from('profiles').delete().eq('id', currentUserId);

            if (!error) {
                await supabase.auth.signOut();
                window.location.href = '/deleted.html';
            } else {
                alert('Delete failed.');
            }
        };

        window.switchAccount = async () => {
            await supabase.auth.signOut();
            window.location.href = '/login.html';
        };

        init();
    </script>
</body>
</html>
