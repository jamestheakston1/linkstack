<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LinkStack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-2 font-black text-3xl text-indigo-600 mb-4">
                <i data-feather="layers" class="w-8 h-8"></i><span>LinkStack</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight">Welcome back</h1>
            <p class="text-slate-500 font-medium">Log in to manage your digital identity</p>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border-2 border-white">
            <div class="space-y-4 mb-8">
                <button onclick="loginWithGithub()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl flex items-center justify-center gap-3 hover:bg-black transition">
                    <i data-feather="github" class="w-5 h-5"></i>
                    Continue with GitHub
                </button>
            </div>

            <div class="flex items-center gap-4 mb-8 before:h-px before:flex-1 before:bg-slate-100 after:h-px after:flex-1 after:bg-slate-100 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                Or use email
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com" 
                        class="w-full mt-1 px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full mt-1 px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-slate-400 font-medium text-sm">
            Don't have an account? <a href="/signup.html" class="text-indigo-600 font-black hover:underline">Join the stack</a>
        </p>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.8';

        const SB_URL = 'https://xcicvuqdoztxhidwdmlc.supabase.co';
        const SB_KEY = 'YOUR_ANON_KEY';
        const supabase = createClient(SB_URL, SB_KEY);

        window.loginWithGithub = async function() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/dashboard' }
            });
            if (error) alert(error.message);
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="w-4 h-4 animate-spin"></i>';
            feather.replace();

            const { error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                alert(error.message);
                btn.disabled = false;
                btn.innerText = 'Sign In';
                feather.replace();
            } else {
                window.location.href = '/dashboard';
            }
        };

        feather.replace();
    </script>
</body>
</html>
