<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Stack | LinkStack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-2 font-black text-3xl text-indigo-600 mb-4">
                <i data-feather="layers" class="w-8 h-8"></i><span>LinkStack</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight">Create your account</h1>
            <p class="text-slate-500 font-medium">Start building your digital identity today</p>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border-2 border-white">
            <form onsubmit="handleSignUp(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Claim Handle</label>
                    <div class="relative">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 font-bold">linkstack.com/</span>
                        <input type="text" id="handle" required placeholder="username" 
                            class="w-full mt-1 pl-[110px] pr-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                    </div>
                    <p id="handle-msg" class="text-[10px] font-bold mt-2 ml-2 hidden"></p>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com" 
                        class="w-full mt-1 px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Choose Password</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full mt-1 px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none focus:ring-4 ring-indigo-500/10 transition">
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition flex items-center justify-center gap-2 mt-4">
                    Create My Stack
                </button>
            </form>

            <div class="flex items-center gap-4 my-8 before:h-px before:flex-1 before:bg-slate-100 after:h-px after:flex-1 after:bg-slate-100 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                Or
            </div>

            <button onclick="signUpWithGithub()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl flex items-center justify-center gap-3 hover:bg-black transition">
                <i data-feather="github" class="w-5 h-5"></i>
                Sign up with GitHub
            </button>
        </div>

        <p class="text-center mt-8 text-slate-400 font-medium text-sm">
            Already have an account? <a href="/login.html" class="text-indigo-600 font-black hover:underline">Log in</a>
        </p>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.8';

        const SB_URL = 'https://xcicvuqdoztxhidwdmlc.supabase.co';
        const SB_KEY = 'YOUR_ANON_KEY';
        const supabase = createClient(SB_URL, SB_KEY);

        const handleInput = document.getElementById('handle');
        const handleMsg = document.getElementById('handle-msg');

        handleInput.addEventListener('input', async (e) => {
            const handle = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
            e.target.value = handle;

            if (handle.length < 3) {
                handleMsg.classList.add('hidden');
                return;
            }

            const { data } = await supabase.from('profiles').select('handle').eq('handle', handle).single();

            handleMsg.classList.remove('hidden');
            if (data) {
                handleMsg.innerText = '✕ Handle already taken';
                handleMsg.className = 'text-[10px] font-bold mt-2 ml-2 text-red-500';
            } else {
                handleMsg.innerText = '✓ Handle available';
                handleMsg.className = 'text-[10px] font-bold mt-2 ml-2 text-emerald-500';
            }
        });

        window.signUpWithGithub = async function() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/dashboard' }
            });
            if (error) alert(error.message);
        };

        window.handleSignUp = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const handle = document.getElementById('handle').value;

            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="w-4 h-4 animate-spin"></i>';
            feather.replace();

            const { data: authData, error: authError } = await supabase.auth.signUp({
                email,
                password,
            });

            if (authError) {
                alert(authError.message);
                btn.disabled = false;
                btn.innerText = 'Create My Stack';
                feather.replace();
                return;
            }

            if (authData.user) {
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        { id: authData.user.id, handle: handle, display_name: handle }
                    ]);

                if (profileError) {
                    alert('Auth successful, but profile creation failed: ' + profileError.message);
                } else {
                    window.location.href = '/dashboard';
                }
            }
        };

        feather.replace();
    </script>
</body>
</html>
