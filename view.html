<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkStack</title>
    
    <meta name="description" id="meta-description" content="Check out this profile on LinkStack.">
    <meta property="og:type" content="website">
    <meta property="og:title" id="og-title" content="LinkStack Profile">
    <meta property="og:description" id="og-description" content="Everything you are in one simple link.">
    <meta property="og:image" id="og-image" content="">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="LinkStack Profile">
    <meta name="twitter:description" id="twitter-description" content="Everything you are in one simple link.">
    <meta name="twitter:image" id="twitter-image" content="">

    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        .profile-card { backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); }
        .link-item { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .link-item:hover { transform: scale(1.02); }
        .badge-pulse { animation: shadow-pulse 2s infinite; }
        @keyframes shadow-pulse {
            0% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-16 px-6">

    <div id="loading" class="fixed inset-0 bg-slate-50 z-50 flex items-center justify-center">
        <div class="animate-spin text-indigo-600"><i data-feather="loader" class="w-8 h-8"></i></div>
    </div>

    <div id="profile-container" class="w-full max-w-md hidden">
        <header class="text-center mb-10">
            <div class="relative inline-block mb-6">
                <img id="avatar" src="" alt="Avatar" class="w-28 h-28 rounded-[2.5rem] object-cover mx-auto shadow-2xl border-4 border-white">
                <div id="verified-badge" class="hidden absolute -bottom-1 -right-1 bg-indigo-600 text-white p-1.5 rounded-full border-4 border-slate-50 badge-pulse">
                    <i data-feather="check" class="w-4 h-4"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-slate-900 mb-2 flex items-center justify-center gap-1">
                <span id="display-name"></span>
            </h1>
            <p id="bio" class="text-slate-500 font-medium px-4"></p>
        </header>

        <div id="links-stack" class="space-y-4"></div>

        <footer class="mt-20 text-center">
            <a href="https://link-stack.pages.dev/" class="inline-flex items-center gap-2 px-5 py-2.5 bg-white border border-slate-200 rounded-2xl text-xs font-black text-slate-400 hover:text-indigo-600 transition shadow-sm">
                <i data-feather="layers" class="w-3.5 h-3.5"></i>
                Create your own LinkStack
            </a>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://xcicvuqdoztxhidwdmlc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DeSw5UHzjV444ZF6eMkB0g_taV-dynR';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const handle = params.get('u');

            if (!handle) {
                window.location.href = '/404.html';
                return;
            }

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('handle', handle.toLowerCase())
                .single();

            if (error || !profile) {
                window.location.href = '/404.html';
                return;
            }

            const pageTitle = `${profile.handle} on LinkStack`;
            const pageDesc = profile.bio || `View ${profile.handle}'s profile on LinkStack.`;
            const avatarUrl = profile.avatar_url || `https://ui-avatars.com/api/?name=${profile.handle}&background=6366f1&color=fff`;

            document.title = pageTitle;
            document.getElementById('meta-description').content = pageDesc;
            
            document.getElementById('og-title').content = pageTitle;
            document.getElementById('og-description').content = pageDesc;
            document.getElementById('og-image').content = avatarUrl;
            
            document.getElementById('twitter-title').content = pageTitle;
            document.getElementById('twitter-description').content = pageDesc;
            document.getElementById('twitter-image').content = avatarUrl;

            const favicon = document.getElementById('dynamic-favicon');
            favicon.href = avatarUrl;
            favicon.type = "image/x-icon";

            document.getElementById('display-name').innerText = profile.display_name || `@${profile.handle}`;
            document.getElementById('bio').innerText = profile.bio || '';
            document.getElementById('avatar').src = avatarUrl;
            
            if (profile.is_verified) {
                document.getElementById('verified-badge').classList.remove('hidden');
            }

            const { data: links } = await supabaseClient
                .from('links')
                .select('*')
                .eq('user_id', profile.id)
                .order('order_index', { ascending: true });

            const stack = document.getElementById('links-stack');
            links?.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = "_blank";
                a.className = "link-item block w-full p-4 bg-white border border-slate-100 rounded-[1.5rem] shadow-sm flex items-center gap-4 hover:border-indigo-600 group transition-all";
                
                let iconName = 'link';
                const url = link.url.toLowerCase();
                if (url.includes('instagram.com')) iconName = 'instagram';
                else if (url.includes('twitter.com') || url.includes('x.com')) iconName = 'twitter';
                else if (url.includes('youtube.com')) iconName = 'youtube';
                else if (url.includes('github.com')) iconName = 'github';
                else if (url.includes('linkedin.com')) iconName = 'linkedin';

                a.innerHTML = `
                    <div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors">
                        <i data-feather="${iconName}" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-slate-700">${link.title}</span>
                    <i data-feather="chevron-right" class="w-4 h-4 ml-auto text-slate-300 group-hover:text-indigo-600 transition-colors"></i>
                `;
                stack.appendChild(a);
            });

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('profile-container').classList.remove('hidden');
            feather.replace();
            
            await supabaseClient.rpc('increment_profile_views', { profile_id: profile.id });
        }

            loadProfile();
    </script>
</body>
</html>
